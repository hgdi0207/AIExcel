services:
  backend:
    image: aiexcel-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aiexcel-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${AIEXCEL_POSTGRES_USER:-aiexcel}:${AIEXCEL_POSTGRES_PASSWORD:-change-me}@postgres:5432/${AIEXCEL_POSTGRES_DB:-aiexcel}
      REDIS_URL: redis://redis:6379
      FRONTEND_ORIGIN: http://YOUR_SERVER_IP:3211
      CORS_ORIGINS: http://YOUR_SERVER_IP:3211
      PIVOT_EXPORT_SERVICE_URL: http://pivot-export:8085
    ports:
      - '3210:3000'
    volumes:
      - ./backend/storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pivot-export:
        condition: service_started
    networks:
      - aiexcel-internal

  frontend:
    image: aiexcel-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_ORIGIN: http://backend:3000
    container_name: aiexcel-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_ORIGIN: http://backend:3000
    ports:
      - '3211:3001'
    depends_on:
      - backend
    networks:
      - aiexcel-internal

  pivot-export:
    image: aiexcel-pivot-export:latest
    build:
      context: ./java-pivot-export-service
      dockerfile: Dockerfile
    container_name: aiexcel-pivot-export
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      PIVOT_EXPORT_SHARED_TOKEN: change-me
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1024m
    expose:
      - '8085'
    networks:
      - aiexcel-internal

  postgres:
    image: postgres:16
    container_name: aiexcel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIEXCEL_POSTGRES_DB:-aiexcel}
      POSTGRES_USER: ${AIEXCEL_POSTGRES_USER:-aiexcel}
      POSTGRES_PASSWORD: ${AIEXCEL_POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - '5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIEXCEL_POSTGRES_USER:-aiexcel} -d ${AIEXCEL_POSTGRES_DB:-aiexcel}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - aiexcel-internal

  redis:
    image: redis:7.4
    container_name: aiexcel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - '6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - aiexcel-internal

volumes:
  postgres_data:
  redis_data:

networks:
  aiexcel-internal:
    driver: bridge